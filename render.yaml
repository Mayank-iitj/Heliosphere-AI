services:
  - type: web
    name: heliosphere-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: USE_LIVE_UPSTREAM
        value: "true"
