# Render.com blueprint — one-click deploy of both services.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: heliosphere-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./heliosphere.db
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      # - key: GEMINI_API_KEY
      #   sync: false

  - type: web
    name: heliosphere-frontend
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Point at the backend service's public URL once it is deployed.
      - key: API_PROXY_TARGET
        sync: false
